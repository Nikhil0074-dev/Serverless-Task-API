# AWS SAM alternative — deploy with:  sam build && sam deploy --guided
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CodeNova Task API (Lambda + HTTP API + DynamoDB)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref TasksTable
        ALLOWED_ORIGIN: '*'

Resources:
  TaskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 86400

  TaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TasksTable }
      Events:
        Health:   { Type: HttpApi, Properties: { ApiId: !Ref TaskApi, Path: /health, Method: GET } }
        TasksAny: { Type: HttpApi, Properties: { ApiId: !Ref TaskApi, Path: /tasks, Method: ANY } }
        TaskAny:  { Type: HttpApi, Properties: { ApiId: !Ref TaskApi, Path: '/tasks/{id}', Method: ANY } }

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

Outputs:
  ApiUrl:
    Description: Base URL of the Task API
    Value: !Sub 'https://${TaskApi}.execute-api.${AWS::Region}.amazonaws.com'
